<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a33">
<meta name="build-version" content="7.2.4-20260827">
<link rel="manifest" href="manifest.json?v=724">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<title>Antrenman Takip 7.2.4</title>
<link rel="stylesheet" href="styles.css?v=724">
<link rel="stylesheet" href="enhancements.css?v=724">
<link rel="stylesheet" href="ux-v63.css?v=724">
<link rel="stylesheet" href="v7.css?v=724">
<link rel="stylesheet" href="v7-video.css?v=724">
<link rel="stylesheet" href="navy-theme.css?v=724">
<link rel="stylesheet" href="v7-clean-mobile.css?v=724">
</head>
<body>
<div class="app">
 <header class="header">
  <div class="header-row">
   <div class="brand"><div class="brand-mark">M</div><div><div class="brand-title">Antrenman <span class="version">v7.2.4</span></div><div class="brand-sub" id="dateText"></div></div></div>
   <select class="workout-select" id="workoutSelect" aria-label="Antrenman seç"></select>
  </div>
  <div class="tabs">
   <button class="tab on" data-tab="workout" onclick="showTab('workout')">Antrenman</button>
   <button class="tab" data-tab="history" onclick="showTab('history')">Geçmiş</button>
   <button class="tab" data-tab="analysis" onclick="showTab('analysis')">Gelişim</button>
   <button class="tab" data-tab="cardio" onclick="showTab('cardio')">Kardiyo</button>
   <button class="tab" data-tab="program" onclick="showTab('program')">Ayarlar</button>
  </div>
 </header>
 <div class="update-banner" id="updateBanner"><span>Yeni sürüm hazır.</span><button onclick="activateUpdate()">Yenile</button></div>
 <main class="page on" id="page-workout">
  <div class="panel"><div class="mode-grid">
   <button class="mode-btn" data-mode="normal" onclick="setMode('normal')">Normal</button>
   <button class="mode-btn" data-mode="short" onclick="setMode('short')">Kısa</button>
   <button class="mode-btn" data-mode="low" onclick="setMode('low')">Düşük Enerji</button>
  </div><div class="mode-note" id="modeNote"></div></div>
  <div id="hero"></div>
  <div class="metrics" id="liveMetrics"></div>
  <div id="exerciseList"></div>
  <button class="btn primary full" style="padding:15px;font-size:13px" onclick="finishWorkout()">Antrenmanı Bitir</button>
 </main>
 <main class="page" id="page-history"><div id="historyContent"></div></main>
 <main class="page" id="page-analysis"><div id="analysisContent"></div></main>
 <main class="page" id="page-cardio"><div id="cardioContent"></div></main>
 <main class="page" id="page-program"><div id="programContent"></div></main>
</div>
<div class="bottom">
 <div class="bottom-in"><div><div class="bottom-label">Antrenman süresi</div><div class="bottom-value" id="workoutTimer">0:00</div></div><button class="bottom-rest" id="restTimer" onclick="toggleRest()">1:30</button><button class="bottom-next" onclick="completeNextSet()">Sıradaki Set ✓</button></div>
</div>
<div class="overlay" id="exerciseModal"><div class="modal">
 <div class="modal-title" id="exerciseModalTitle">Hareket</div>
 <div class="grid2">
  <div class="field" style="grid-column:1/-1"><label>Hareket adı</label><input class="input" id="fName"></div>
  <div class="field" style="grid-column:1/-1"><label>Kas grupları — virgülle</label><input class="input" id="fMuscles"></div>
  <div class="field"><label>Başlangıç kg</label><input class="input" id="fWeight" type="number" inputmode="decimal"></div>
  <div class="field"><label>Set</label><input class="input" id="fSets" type="number" inputmode="numeric"></div>
  <div class="field"><label>Tekrar alt</label><input class="input" id="fRepMin" type="number" inputmode="numeric"></div>
  <div class="field"><label>Tekrar üst</label><input class="input" id="fRepMax" type="number" inputmode="numeric"></div>
  <div class="field"><label>Rol</label><select class="select" id="fType"><option value="main">Ana</option><option value="accessory">Yardımcı</option><option value="core">Core / süre</option><option value="carry">Taşıma</option></select></div>
  <div class="field"><label>Artış adımı</label><input class="input" id="fIncrement" type="number" inputmode="decimal"></div>
  <div class="field"><label>Dinlenme sn</label><input class="input" id="fRest" type="number" inputmode="numeric"></div>
  <div class="field"><label>Öncelik</label><select class="select" id="fPriority"><option value="normal">Normal</option><option value="high">Yüksek</option><option value="support">Destek</option></select></div>
  <div class="field" style="grid-column:1/-1"><label>Video bağlantısı</label><input class="input" id="fVideo"></div>
  <div class="field" style="grid-column:1/-1"><label>Teknik not / alternatif</label><input class="input" id="fNote"></div>
  <label class="check" style="grid-column:1/-1"><input type="checkbox" id="fOptional"> Kısa ve düşük enerji gününde atlanabilir</label>
 </div>
 <div class="modal-actions"><button class="btn ghost" onclick="closeExerciseModal()">Vazgeç</button><button class="btn primary" id="exerciseSaveButton" onclick="saveExerciseModal()">Kaydet</button></div>
</div></div>
<div class="overlay" id="confirmModal"><div class="modal"><div class="modal-title" id="confirmTitle">Onay</div><div class="mode-note" id="confirmMessage"></div><div class="modal-actions"><button class="btn ghost" onclick="closeConfirm()">Vazgeç</button><button class="btn primary" id="confirmButton">Devam</button></div></div></div>
<div class="overlay" id="summaryModal"><div class="modal" id="summaryBody"></div></div>
<input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(this.files[0])">
<div class="toast" id="toast"></div>
<script src="app.js?v=724"></script>
<script src="program-patch.js?v=724"></script>
<script src="enhancements.js?v=724"></script>
<script src="ux-v63.js?v=724"></script>
<script src="program-v64.js?v=724"></script>
<script src="v7.js?v=724"></script>
<script src="v7-guard.js?v=724"></script>
<script src="v7-video.js?v=724"></script>
<script src="v7-b-triceps.js?v=724"></script>
<script src="v7-program-v722.js?v=724"></script>
<script src="v7-program-v723.js?v=724"></script>
</body>
</html>
